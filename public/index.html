<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="description" content="Ivanexo Ltd — Smart software for African businesses. Trackly helps Rwandan SMEs manage inventory, sales, and growth." />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Ivanexo Ltd — Built for African Business</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#0B1F3A',
              'navy-light': '#132947',
              'navy-dark': '#070F1D',
              'teal-brand': '#00B4A6',
              'teal-light': '#00D4C4',
              'gold-brand': '#F0A500',
              'gold-light': '#FFB830',
            },
            fontFamily: {
              display: ['"Clash Display"', 'sans-serif'],
              body: ['"Satoshi"', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { scroll-behavior: smooth; max-width: 100vw; overflow-x: hidden; }
  body {
    background-color: #0B1F3A;
    color: #ffffff;
    font-family: 'Satoshi', sans-serif;
    overflow-x: hidden;
  }
  ::selection { background: #00B4A6; color: #0B1F3A; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #070F1D; }
  ::-webkit-scrollbar-thumb { background: #00B4A6; border-radius: 3px; }
  img { max-width: 100%; }

  @media (max-width: 900px) {
    h1, h2 { word-break: break-word; }
    table { font-size: 0.8rem; }
    td, th { padding: 0.6rem 0.75rem !important; }
    section {
      padding-left: 1.25rem !important;
      padding-right: 1.25rem !important;
    }
    [style*="repeat(4, 1fr)"],
    [style*="repeat(4,1fr)"] {
      grid-template-columns: 1fr 1fr !important;
    }
    [style*="repeat(3, 1fr)"],
    [style*="repeat(3,1fr)"] {
      grid-template-columns: 1fr !important;
    }
    [style*="scale(1.05)"] {
      transform: scale(1) !important;
    }
  }
</style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
